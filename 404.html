<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Captures the exact path and search parameters from the old URL
        var oldPath = window.location.pathname;
        var oldSearch = window.location.search;
        
        // Constructs the new destination URL matching the exact sub-page
        var destination = "https://pages.dev" + oldPath + oldSearch;
        
        // Executes the redirect immediately
        window.location.href = destination;
    </script>
</head>
<body>
    <p>This page has moved. You are being redirected to the new site...</p>
</body>
</html>
